version: '3.9'

services:
  api:
    build: .
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_CONNECTION: ${DB_CONNECTION}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PW: ${REDIS_PW}
    ports:
      - ${PORT}:5000
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PW} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - cache:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PW}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  cache:
